components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        city_name:
          type: string
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        instructions:
          type: string
        label:
          type: string
          maxLength: 80
        contact_name:
          type: string
          maxLength: 160
        phone:
          type: string
          maxLength: 24
        address:
          type: string
        is_default:
          type: boolean
          readOnly: true
        user:
          type: integer
          readOnly: true
        city:
          type: integer
      required:
      - address
      - city
      - city_name
      - id
      - is_default
      - label
      - user
    Approval:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ApprovalTypeEnum'
        reason:
          type: string
      required:
      - type
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    ApprovalTypeEnum:
      enum:
      - rider
      - carrier
      type: string
      description: |-
        * `rider` - rider
        * `carrier` - carrier
    Assignment:
      type: object
      properties:
        trip:
          type: integer
        carrier:
          type: integer
        rider:
          type: integer
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        note:
          type: string
        next_action:
          $ref: '#/components/schemas/NextActionEnum'
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        parcel:
          type: integer
        rider:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - next_action
      - note
      - outcome
      - parcel
      - rider
