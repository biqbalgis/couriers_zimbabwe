          maxLength: 80
        target:
          type: string
          maxLength: 120
        reason:
          type: string
        before: {}
        after: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - actor_name
      - created_at
      - id
      - target
    Availability:
      type: object
      properties:
        available:
          type: boolean
      required:
      - available
    BlankEnum:
      enum:
      - ''
    Carrier:
      type: object
