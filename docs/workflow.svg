<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-label="Parcel journey with station collection and home delivery"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#146c56"/></marker></defs><rect width="1100" height="670" fill="#fafcfb"/><g font-family="Arial,sans-serif" fill="#102f28"><text x="35" y="35" font-size="24" font-weight="700">Parcel journey</text><text x="35" y="61" font-size="14" fill="#60766e">Mutare–Chipinge in either direction · fresh code at each custody change</text></g><rect x="45" y="110" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="63" y="144" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">Booked</text><text x="63" y="175" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Sender custody</text><rect x="370" y="110" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="388" y="144" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">Picked up</text><text x="388" y="175" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Optional first mile</text><rect x="695" y="110" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="713" y="144" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">At origin station</text><text x="713" y="175" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Origin operator custody</text><rect x="695" y="290" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="713" y="324" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">In transit</text><text x="713" y="355" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Verified payment required</text><rect x="370" y="290" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="388" y="324" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">At destination station</text><text x="388" y="355" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Destination operator custody</text><rect x="45" y="470" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="63" y="504" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">Out for delivery</text><text x="63" y="535" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Assigned rider plus verified receipt</text><rect x="370" y="470" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="388" y="504" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">Delivered</text><text x="388" y="535" font-family="Arial,sans-serif" font-size="13" fill="#60766e">Recipient confirmation</text><rect x="695" y="470" width="265" height="95" rx="12" fill="white" stroke="#cfdcd5"/><text x="713" y="504" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102f28">Exception or cancelled</text><text x="713" y="535" font-family="Arial,sans-serif" font-size="13" fill="#60766e">See eligibility and return rules</text><g fill="none" stroke="#146c56" stroke-width="2" marker-end="url(#arrow)"><path d="M310 157H366"/><path d="M635 157H691"/><path d="M175 110V85H827V106"/><path d="M827 205V286"/><path d="M695 338H639"/><path d="M500 385V466"/><path d="M370 338H177V466"/><path d="M310 517H366"/></g><g font-family="Arial,sans-serif" font-size="12" fill="#60766e"><text x="320" y="145">Pickup</text><text x="645" y="145">Receipt</text><text x="480" y="80">Direct station drop off</text><text x="840" y="250">Carrier collection</text><text x="640" y="325">Arrival</text><text x="510" y="430">Station collection</text><text x="55" y="420">Home delivery</text><text x="47" y="609">Final home delivery also requires a proof photo and recipient signature.</text><text x="47" y="634">Exceptions can lead to returned. Cancellation is limited to pre-transport shipments without verified payment.</text></g></svg>
